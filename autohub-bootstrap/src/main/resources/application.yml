# =====================================================================
# Configuration de l'application
# =====================================================================
spring:
  application:
    name: autohub

  datasource:
    # Surcharges par variables d'environnement : en local, docker-compose
    # fournit les valeurs ; en production, le fournisseur d'hebergement.
    # Aucun secret n'est jamais ecrit en dur dans ce fichier.
    # Port 15432 : celui publie par docker-compose.yml, ou le pourquoi est explique.
    # En resume : 5432 peut etre partage avec un PostgreSQL natif de la machine,
    # et la connexion part alors vers l'un ou l'autre de facon non deterministe.
    url: ${DB_URL:jdbc:postgresql://localhost:15432/autohub}
    username: ${DB_USER:autohub}
    password: ${DB_PASSWORD:autohub}

  jpa:
    hibernate:
      # ------------------------------------------------------------------
      # "validate" et non "update" : ce reglage est structurant.
      # Hibernate verifie que le schema correspond au modele, mais ne le
      # modifie JAMAIS. Le schema appartient a Flyway, point final.
      # Si tu lis "update" ici un jour, c'est que quelqu'un a contourne
      # une migration qui echouait -- creuse le vrai probleme.
      # ------------------------------------------------------------------
      ddl-auto: validate
    open-in-view: false
    # open-in-view=false : desactive l'anti-pattern OSIV. Par defaut Spring
    # garde la session Hibernate ouverte jusqu'au rendu de la reponse, ce qui
    # masque les chargements paresseux et provoque des N+1 invisibles.
    # Avec false, une LazyInitializationException surgit en test plutot
    # qu'une lenteur inexplicable en production.
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
        # ------------------------------------------------------------------
        # Indispensable a l'ADR 0002, decouvert par les tests d'integration.
        # Sans ce reglage, Hibernate convertit chaque LocalDateTime en
        # java.sql.Timestamp dans le fuseau de la JVM, puis l'ecrit en UTC
        # (a cause de time_zone ci-dessus). Consequences mesurees sur une JVM
        # en Europe/Paris :
        #   - 08:00 cote domaine est stocke 07:00 en base ;
        #   - 02:00 et 03:00 le jour du passage a l'heure d'ete deviennent
        #     tous deux 01:00 UTC : la plage est VIDE, et une plage vide
        #     echappe a la contrainte d'exclusion.
        # En CI (JVM en UTC), rien de tout cela ne se voit.
        # Avec true, le pilote recoit le LocalDateTime tel quel (setObject) et
        # ecrit l'heure nominale dans la colonne timestamp, sans conversion.
        # ------------------------------------------------------------------
        type:
          java_time_use_direct_jdbc: true

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: false

management:
  endpoints:
    web:
      exposure:
        # Volontairement restreint. Exposer "*" en production revient a
        # publier /actuator/env, qui contient les variables d'environnement.
        include: health,info,metrics,prometheus
  endpoint:
    health:
      show-details: when-authorized
      probes:
        enabled: true   # /actuator/health/liveness et /readiness (Kubernetes)
  metrics:
    tags:
      application: ${spring.application.name}

logging:
  level:
    com.ocarius.autohub: DEBUG
    org.flywaydb: INFO
